[toolchain]
package_manager = "pnpm"

[features]
resolution = true
skip-lint = false

[programs.devnet]
holdem = "58WSqBPM7wYJTkJg9rC9215yagvXQRphMctZoA6WUC8v"

[programs.localnet]
holdem = "58WSqBPM7wYJTkJg9rC9215yagvXQRphMctZoA6WUC8v"

[provider]
cluster = "localnet"
wallet = "../keys/devnet-payer.json"

[scripts]
test = "pnpm exec ts-mocha --exit -p ./tsconfig.json -t 3600000 \"tests/**/*.ts\""

[hooks]

[test]
startup_wait = 5000
shutdown_wait = 2000
upgradeable = false

[test.validator]
bind_address = "127.0.0.1"
ledger = ".anchor/test-ledger"
rpc_port = 8899
